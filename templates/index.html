<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Dosya Metadata Görüntüle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <style>
    .bordered-content { white-space: pre-wrap; max-height:200px; overflow:auto; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Dosya Yükle & Metadata Görüntüle</h1>
    <form method="post" enctype="multipart/form-data">
      <input type="file" name="files" multiple class="form-control mb-3">
      <button class="btn btn-primary mb-4">Gönder</button>
    </form>
    {% if entries %}
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr><th>Dosya</th><th>Yazar</th><th>Sahip</th><th>Oluşturulma</th><th>İçerik</th></tr>
        </thead>
        <tbody>
          {% for e in entries %}
            <tr>
              <td>{{ e.name }}</td>
              <td>{{ e.creator }}</td>
              <td>{{ e.owner }}</td>
              <td>{{ e.creationDate }}</td>
              <td><div class="border p-2 bordered-content">{{ e.content }}</div></td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endif %}
  </div>
</body>
</html>
