<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Çoklu Dosya Arama & Metadata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.7.107/build/pdf.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.1/mammoth.browser.min.js"
          integrity="sha512-N4Uo11qseyexXRHHXEqTzmr6paAgBuR3KKv3XLEYoAEYKUYAmbt3dagx3R3YQKZ8NLtwFfnqSOFnH45O1MY0Iw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    body { background: #f8f9fa; }
    .bordered-content { white-space: pre-wrap; max-height:200px; overflow:auto; }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">Dosya Yükle & Arama</h1>
    <input type="file" id="file-input" class="form-control mb-3"
           multiple accept=".pdf,.docx,.xlsx,.txt,.xml" />
    <input type="text" id="search-input" class="form-control mb-4"
           placeholder="Arama terimi…" disabled />

    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Yükleniyor…</span>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>Dosya</th><th>Yazar</th><th>Sahip</th><th>Oluşturulma</th><th>İçerik</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </div>


 
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.7.107/build/pdf.worker.min.js';

    const fileInput   = document.getElementById('file-input');
    const searchInput = document.getElementById('search-input');
    const spinner     = document.getElementById('spinner');
    const tbody       = document.getElementById('results-body');
    let entries = [];

    fileInput.addEventListener('change', async () => {
      spinner.classList.remove('d-none');
      searchInput.value = '';
      searchInput.disabled = true;
      tbody.innerHTML = '';

      entries = await Promise.all(
        Array.from(fileInput.files).map(f => parseFile(f))
      );
      renderTable(entries);
      spinner.classList.add('d-none');
      searchInput.disabled = false;
    });

    searchInput.addEventListener('input', () => {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = term
        ? entries.filter(e =>
            [e.name, e.creator, e.owner, e.content]
              .some(field => field.toLowerCase().includes(term))
          )
        : entries;
      renderTable(filtered, term);
    });

 
    function highlight(text, re) {
      if (!re) return text;
      return text.replace(re, m => `<span class="bg-warning text-dark">${m}</span>`);
    }

    function renderTable(list, highlightTerm = '') {
      tbody.innerHTML = '';
      const re = highlightTerm ? new RegExp(highlightTerm, 'gi') : null;
      list.forEach(e => {
        const nameCell   = highlight(e.name, re);
        const authorCell = highlight(e.creator, re);
        const ownerCell  = highlight(e.owner, re);
        const dateCell   = e.creationDate;
        let contentCell  = e.content.replace(/\r?\n/g, '<br>');
        if (re) contentCell = highlight(contentCell, re);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${nameCell}</td>
          <td>${authorCell}</td>
          <td>${ownerCell}</td>
          <td>${dateCell}</td>
          <td><div class="border p-2 bordered-content">${contentCell}</div></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function parseFile(file) {
      const nameLC = file.name.toLowerCase();
      let creator      = '—';
      let owner        = '—';
      let creationDate = '—';
      let content      = '';
      const arrayBuffer = await file.arrayBuffer();

      const fmtDate = d => new Date(d).toLocaleString('tr-TR', {
        day:'numeric', month:'long', year:'numeric',
        hour:'2-digit', minute:'2-digit'
      });

      try {
     
        if (file.type === 'application/pdf' || nameLC.endsWith('.pdf')) {
          const pdf  = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const meta = await pdf.getMetadata();
          creator      = meta.info.Creator || '—';
          owner        = meta.info.Author  || '—';
          if (meta.info.CreationDate) {
            const r = meta.info.CreationDate.replace(/^D:/,'');
            creationDate = fmtDate(`${r.slice(0,4)}-${r.slice(4,6)}-${r.slice(6,8)}T${r.slice(8,10)}:${r.slice(10,12)}`);
          } else creationDate = fmtDate(file.lastModified);

          const pages = await Promise.all(
            Array.from({ length: pdf.numPages }, (_, i) =>
              pdf.getPage(i+1)
                 .then(p => p.getTextContent())
                 .then(tc => tc.items.map(it=>it.str).join(' '))
            )
          );
          content = pages.join('\n');
        }

    
        else if (file.type==='text/plain' || nameLC.endsWith('.txt')) {
          const txt   = new TextDecoder().decode(arrayBuffer);
          const lines = txt.trim().split(/\r?\n/);
          const last  = lines[lines.length-1].trim();
          if (/^[\p{L}\s]+$/u.test(last) && lines.length>1) {
            creator = owner = last;
            lines.pop();
          }
          content      = lines.join('\n');
          creationDate = fmtDate(file.lastModified);
        }

    
        else if (nameLC.endsWith('.docx')) {
          const zip = await JSZip.loadAsync(arrayBuffer);
          if (zip.file('docProps/core.xml')) {
            const metaStr = await zip.file('docProps/core.xml').async('string');
            const md      = new DOMParser().parseFromString(metaStr,'application/xml');
            creator      = md.querySelector('dc\\:creator, creator')?.textContent      || creator;
            owner        = md.querySelector('cp\\:lastModifiedBy, lastModifiedBy')?.textContent || owner;
            const dtN    = md.querySelector('dcterms\\:created, created');
            if (dtN?.textContent) {
              const d = new Date(dtN.textContent);
              creationDate = isNaN(d) ? dtN.textContent : fmtDate(d);
            }
          }
          if (creationDate==='—') creationDate = fmtDate(file.lastModified);

          try {
            const { value: txt } = await mammoth.extractRawText({ arrayBuffer });
            content = txt.trim();
          } catch {
            content = '';
          }
        }


        // XLSX
        else if (nameLC.endsWith('.xlsx')) {
          const wb = XLSX.read(arrayBuffer,{type:'array'});
          creator      = wb.Props?.Author     || '—';
          owner        = wb.Props?.LastAuthor || '—';
          creationDate = wb.Props?.CreatedDate
                         ? fmtDate(wb.Props.CreatedDate)
                         : fmtDate(file.lastModified);
          content      = wb.SheetNames
                             .map(sn=>XLSX.utils.sheet_to_csv(wb.Sheets[sn]))
                             .join('\n');
        }
      } catch(e) {
        console.error('Dosya işleme hatası:', e);
        creationDate = fmtDate(file.lastModified);
      }

      return { name: file.name, creator, owner, creationDate, content };
    }
  </script>
</body>
</html>
